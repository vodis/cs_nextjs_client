# Release gate: PRs into master must bump package.json semver vs base branch.
# Bump version in the release PR (staging → master) before merge.

name: Release version check

on:
  pull_request:
    branches:
      - master

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          fetch-depth: 0

      - name: Verify package.json version was bumped
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node ci/check-version-bump.mjs
