# Production — orchestrator intake via GHCR (cs_orchestrator polls tags; no webhook).
#
# On push / workflow_dispatch to `master`:
#   1. ghcr.io/vodis/cs_nextjs_client:production
#   2. ghcr.io/vodis/cs_nextjs_client:production-metadata
#
# PRs targeting `master` run lint only (no image push).
# Implementation: .github/workflows/reusable-build.yml

name: Build PROD - Frontend

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prod:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      environment: production
      service_name: craftscript
      git_branch: master
      image_tag: production
      metadata_tag: production-metadata
      artifact_prefix: prod-deploy-bundle
      concurrency_group: prod-orchestrator
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
